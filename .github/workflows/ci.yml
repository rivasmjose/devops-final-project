name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests"
        required: true
        default: "staging"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage threshold
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          path: coverage-reports

      - name: Generate Consolidated Summary
        run: |
          echo "## 🧪 Test Matrix Summary" >> $GITHUB_STEP_SUMMARY
          echo "| OS | Python | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----|---------|--------|" >> $GITHUB_STEP_SUMMARY
          for version in 3.10 3.12; do
            if [ -d "coverage-reports/coverage-report-$version" ]; then
              echo "| ubuntu-latest | $version | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ubuntu-latest | $version | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  auto-merge-dev-to-stage:
    needs: report
    if: github.event_name == 'pull_request' && github.base_ref == 'stage' && github.head_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Auto Merge PR
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --admin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manual-approval-stage-to-main:
    needs: report
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'stage'
    runs-on: ubuntu-latest
    steps:
      - name: Require Manual Approval
        run: |
          echo "✅ Tests passed. Please approve manually in GitHub UI."
