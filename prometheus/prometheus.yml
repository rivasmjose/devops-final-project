global:
  scrape_interval: 15s  # How often to scrape targets
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'flask-notes-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:5000']

  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
