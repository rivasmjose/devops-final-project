services:
  app:
    container_name: app
    build: ./app
    image: notes-app:${TAG:-latest}
    environment:
      - DATABASE_URL: postgresql://notes:notes@db:5432/notesdb
      - POSTGRES_USER: admindb
      - POSTGRES_PASSWORD: notes
      - POSTGRES_DB: notesdb
    depends_on:
      - db
    ports:
      - "5000:5000"

  db:
    container_name: db
    image: postgres:15
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notesdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - db

  pgadmin:
    container_name: pg
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@i.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers:/pgadmin4/servers
    depends_on:
      - db

  # prometheus:
  #   image: prom/prometheus
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"

  # grafana:
  #   image: grafana/grafana
  #   ports:
  #     - "3000:3000"

volumes:
  db-data:
  pgadmin-data:
